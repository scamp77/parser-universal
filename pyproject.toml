[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parser-universal"
version = "0.4.0"
description = "Universal reusable parser package (benz + sup-app cross-project)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "gpxpy>=1.6",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
fetchers = [
    "curl-cffi>=0.7",
]
db = [
    "psycopg[binary]>=3.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
parser-cli = "parser_universal.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["parser_universal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "asyncio: mark a test as an asyncio coroutine",
    "integration: integration test (requires live network or DB)",
    "perf: performance / load test (may take a few seconds)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
